<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renvir Ghent</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&family=Inter:wght@300&display=swap">
<style>
  :root { --carbon:#0B0B0C; --panel:#141416; --line:#26262A; --bone:#ECEAE6; --smoke:#9B9995; }
  html, body { background:var(--carbon); color:var(--bone); margin:0; font-family:Inter,sans-serif; font-weight:300; }
  .wrap { max-width:1060px; margin:0 auto; padding:0 28px 80px; }
  header { padding:56px 0 20px; border-bottom:1px solid var(--line); }
  .brand { font-family:Oswald,sans-serif; font-weight:500; letter-spacing:.42em; font-size:15px; }
  .brand span { color:var(--smoke); font-weight:300; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; padding:40px 0; }
  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
  .media { background:var(--panel); border:1px solid var(--line); padding:10px; }
  .media img, .media video { display:block; width:100%; height:auto; aspect-ratio:4/5; object-fit:contain; background:#000; }
  .cap { font-family:Oswald,sans-serif; font-weight:300; color:var(--smoke); letter-spacing:.18em; font-size:11px; padding:10px 4px 2px; }
  footer { padding:24px 0 0; font-family:Oswald,sans-serif; font-weight:300; letter-spacing:.34em; font-size:12px; color:var(--smoke); display:flex; justify-content:space-between; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">RENVIR&nbsp;&nbsp;<span>/&nbsp;&nbsp;GHENT</span></div></header>
  <div class="grid">
    <div class="media"><img src="g01-still.jpg" alt=""><div class="cap">STILL &nbsp;/&nbsp; 4:5</div></div>
    <div class="media"><video controls playsinline muted loop autoplay preload="metadata" poster="g01-still.jpg" src="g01-rain.mp4"></video><div class="cap">4 SEC &nbsp;/&nbsp; 4:5</div></div>
  </div>
  <footer><span>RENVIR</span><span>RENEWED MAN</span></footer>
</div>
</body>
</html>
