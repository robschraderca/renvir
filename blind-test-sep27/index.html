<html lang="en">
<head>

<title>Renvir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&family=Inter:wght@400;500&display=swap">
<style>
:root{--ink:#0a0a0a;--line:#262626;--text:#e9e7e2;--smoke:#a9a7a2;--dim:#6f6d69;--gold:#e8b980;--white:#fff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:360px}
.wm{font-family:Oswald,Impact,sans-serif;font-weight:300;letter-spacing:.42em;font-size:22px;color:var(--white)}
.wm sup{font-size:9px;letter-spacing:0;margin-left:2px}
p{color:var(--smoke);margin:14px 0 22px}
form{display:flex;flex-direction:column;gap:10px}
input{font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:#111;color:var(--white);outline:none;width:100%}
input:focus{border-color:var(--gold)}
button{font-family:Oswald,Impact,sans-serif;font-weight:500;letter-spacing:.18em;text-transform:uppercase;font-size:13px;padding:12px;border:1px solid var(--gold);border-radius:6px;background:transparent;color:var(--gold);cursor:pointer}
button:disabled{opacity:.5}
.err{color:#e88;font-size:13px;min-height:1.4em;margin:0}
</style>
</head>

  </form>

  var SALT_B64 = "mpBpwZnA4tig3Dir5JQ+ww==", ITER = 400000;
  var LEAD = "This page is for the people it was sent to. Enter the password from Rob.";
  function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function get(k) { try { var v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} try { return sessionStorage.getItem(k); } catch (e) {} return null; }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} try { sessionStorage.setItem(k, v); } catch (e) {} }
  function forget() { ["localStorage", "sessionStorage"].forEach(function (s) { try { var st = window[s], ks = []; for (var i = 0; i < st.length; i++) if (st.key(i).indexOf("gate_") === 0) ks.push(st.key(i)); ks.forEach(function (k) { st.removeItem(k); }); } catch (e) {} }); }
  var SALT = b64d(SALT_B64), CT = document.getElementById("ct").textContent.trim();
  var f = document.getElementById("f"), pw = document.getElementById("pw"), go = document.getElementById("go"), err = document.getElementById("err"), lead = document.getElementById("lead");
  if (!(window.crypto && crypto.subtle)) { lead.textContent = "This browser cannot open the page. Use Safari or Chrome."; f.hidden = true; return; }
  function derive(p) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]).then(function (km) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    });
  }
  function unlock(key) {
    return crypto.subtle.exportKey("raw", key).then(function (raw) {
      var u = b64d(CT);
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, key, u.slice(12)).then(function (pt) {
        return { html: new TextDecoder().decode(pt), raw: b64e(raw) };
      });
    });
  }
  function show(r) {
    // A cached key can be ready before this document has finished parsing, and
    // document.write into a still-loading document appends instead of replacing.
    if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", function () { show(r); }); return; }
    window.__gateKeyRaw = r.raw; put("gate_k:" + SALT_B64, r.raw);
    document.open(); document.write(r.html); document.close();
  }
  var exp = +get("gate_exp") || 0;
  if (exp && Date.now() > exp) forget();
  var k = get("gate_k:" + SALT_B64);
  var auto = k ? crypto.subtle.importKey("raw", b64d(k), { name: "AES-GCM" }, true, ["decrypt"]).then(unlock) : Promise.reject(0);
  auto = auto.catch(function () { var p = get("gate_pw"); if (!p) throw 0; lead.textContent = "Opening…"; return derive(p).then(unlock); });
  auto.then(show, function () { lead.textContent = LEAD; pw.focus(); });
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var p = pw.value; if (!p) return;
    go.disabled = true; err.textContent = ""; lead.textContent = "Opening…";
    derive(p).then(unlock).then(function (r) {
      put("gate_pw", p); put("gate_exp", String(Date.now() + 14 * 864e5)); show(r);
    }, function () {
      go.disabled = false; lead.textContent = LEAD; err.textContent = "That is not the password."; pw.select();
    });
  });
})();
